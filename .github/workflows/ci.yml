name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm nx test cli

      - run: pnpm nx typecheck cli

      - run: pnpm nx build cli

      - name: Verify package contents
        working-directory: packages/cli
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const fs = require('fs');
            const [pkg] = JSON.parse(fs.readFileSync('/tmp/pack.json', 'utf8'));
            const files = pkg.files.map(f => f.path);
            const hasAssets = files.some(f => f.startsWith('assets/'));
            const hasHooks = files.some(f => f.startsWith('assets/hooks/'));
            const hasBin = files.some(f => f === 'bin/argos.js');
            const hasManaged = files.some(f => f.startsWith('assets/managed/'));
            const hasAgents = files.some(f => f.startsWith('assets/agents/'));
            const hasOutputStyles = files.some(f => f.startsWith('assets/output-styles/'));
            const skillCount = files.filter(f => f.match(/^assets\/skills\/[^/]+\/SKILL\.md$/)).length;
            if (!hasAssets || !hasHooks || !hasBin || !hasManaged || !hasAgents || !hasOutputStyles || skillCount < 50) {
              console.error('Pack guard failed: missing required files or insufficient skills');
              console.error('  assets/: ' + (hasAssets ? 'OK' : 'MISSING'));
              console.error('  assets/hooks/: ' + (hasHooks ? 'OK' : 'MISSING'));
              console.error('  bin/argos.js: ' + (hasBin ? 'OK' : 'MISSING'));
              console.error('  assets/managed/: ' + (hasManaged ? 'OK' : 'MISSING'));
              console.error('  assets/agents/: ' + (hasAgents ? 'OK' : 'MISSING'));
              console.error('  assets/output-styles/: ' + (hasOutputStyles ? 'OK' : 'MISSING'));
              console.error('  assets/skills/*/SKILL.md: ' + skillCount + ' (need >= 50)');
              console.error(files.join('\n'));
              process.exit(1);
            }
            console.log('Pack guard OK:', files.length, 'files, including', skillCount, 'skill definitions');
          "
